# theming.conf
# Carbonfox-inspired palette — adjusted for a more grey, blue-tinted look

foreground              #A8BCE8
background              #1E1E1E
selection_foreground    #1E1E1E
selection_background    #7E90C0

# --- Transparency Settings ---

#background_opacity 0.92
#dynamic_background_opacity yes
#background_tint 0.0

# -----------------------------

# Cursor colors

cursor                  #B8C4F0
cursor_text_color       #1E1E1E

# URL underline color

url_color               #6AA0C0

# Kitty window border colors

active_border_color     #98A8D0
inactive_border_color   #44485A
bell_border_color       #D0B888

# OS Window titlebar colors

wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors — background matches terminal, active tab highlighted white

active_tab_foreground   #1E1E1E
active_tab_background   #FFFFFF
inactive_tab_foreground #FFFFFF
inactive_tab_background #1E1E1E
tab_bar_background      #1E1E1E

